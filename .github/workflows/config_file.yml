name: anthelion-devops-demo

# Controls when the action will run. 
on:
  push:
    branches:
      - prod
      - qa
    paths:
      - 'DATABASES/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
     dev:
        name: qa
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/qa'
        steps:
          # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
          - name: Checkout repository
            uses: actions/checkout@v2
    
          - name: Use Python 3.8.x
            uses: actions/setup-python@v2.2.1
            with:
              python-version: 3.8.x

          - name: Decrypt RSA key
            run: 
              echo "${{ secrets.SF_PRIVATE_KEY }}"  > private_key.p8
              chmod 600 private_key.p8
    
          - name: Create connections.toml
          
            env:
              SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
              SF_USERNAME: ${{ secrets.SF_USERNAME }}
              SF_ROLE: ${{ secrets.SF_ROLE }}
              SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
              SF_DATABASE: ${{ secrets.SF_QA_DATABASE}}

            run: |
              cat <<EOF > connections.toml
              [snowflake]
              account = ${{ secrets.SF_ACCOUNT }}
              user = ${{ secrets.SF_USERNAME }}
              role = ${{ secrets.SF_ROLE }}
              warehouse = ${{ secrets.SF_WAREHOUSE }}
              database = ${{ secrets.SF_DATABASE }}
              authenticator = 'snowflake_jwt'
              private_key_file = 'private_key.p8'
              private_key_file_pwd = ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
              EOF
              cat connections.toml

          - name: Secure connections.toml permissions
            run: chmod 600 connections.toml


              
          - name: Run schemachange 
            run: |
              echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
              python --version
              echo "Step 1: Installing schemachange"
              pip install schemachange

              
              
              echo "Step 2: Running schemachange"
              schemachange -f $GITHUB_WORKSPACE/DATABASES -a $SF_ACCOUNT -u $SF_USERNAME -r $SF_ROLE -w $SF_WAREHOUSE -d $SF_DATABASE -c $SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY --create-change-history-table --connections-file-path connections.toml --connection-name snowflake --vars '{"ENV_PREFIX":"QA_"}'

     
     dev2:
        name: prod 
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/prod'
        steps:
          # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
          - name: Checkout repository
            uses: actions/checkout@v2
    
          - name: Use Python 3.8.x
            uses: actions/setup-python@v2.2.1
            with:
              python-version: 3.8.x
    
          - name: Run schemachange
            env:
              SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
              SF_USERNAME: ${{ secrets.SF_USERNAME }}
              SF_ROLE: ${{ secrets.SF_ROLE }}
              SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
              SF_DATABASE: ${{ secrets.SF_PROD_DATABASE }}
              SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
            run: |
              echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
              python --version
              echo "Step 1: Installing schemachange"
              pip install schemachange
              
              echo "Step 2: Running schemachange"
              schemachange -f $GITHUB_WORKSPACE/DATABASES -a $SF_ACCOUNT -u $SF_USERNAME -r $SF_ROLE -w $SF_WAREHOUSE -d $SF_DATABASE -c $SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY --create-change-history-table --vars '{"ENV_PREFIX":""}'

    
